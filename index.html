<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyStride — Build Better Habits</title>
  <link rel="canonical" href="https://www.dailystride.app/" />
  <meta name="description"
    content="Download DailyStride, the simple daily habit tracker designed to help you build positive routines, break bad habits, and stay consistent on your journey to self-improvement." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.dailystride.app/" />
  <meta property="og:title" content="DailyStride — Build Better Habits" />
  <meta property="og:description"
    content="Track habits, break bad ones, and stay consistent with DailyStride — your simple daily growth companion." />
  <meta property="og:image" content="https://www.dailystride.app/web-app-manifest-512x512.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.dailystride.app/" />
  <meta name="twitter:title" content="DailyStride — Build Better Habits" />
  <meta name="twitter:description"
    content="Track habits, break bad ones, and stay consistent with DailyStride — your simple daily growth companion." />
  <meta name="twitter:image" content="https://www.dailystride.app/web-app-manifest-512x512.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DailyStride" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "DailyStride",
    "operatingSystem": "Android, iOS",
    "applicationCategory": "LifestyleApplication",
    "description": "Simple daily habit tracker to build positive routines, break bad habits, and stay consistent.",
    "url": "https://www.dailystride.app/",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Moloko Chris Poopedi"
    }
  }
  </script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    /* Hide static fallback once React hydrates (optional visual safety) */
    #root:not(:empty) .static-fallback {
      /* React replaces content, so this is mainly for non-JS */
    }
  </style>

</head>

<body>

  <div id="root">
    <!-- Static fallback content for crawlers and non-JS browsers.
         React will replace this entire #root content on mount. -->
    <div class="static-fallback" style="font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; color: #333;">
      <header>
        <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Your future is built daily.<br><span style="color: #50BF56;">one stride at a time.</span></h1>
        <p style="font-size: 1.125rem; color: #666; max-width: 600px; margin: 0 auto 2rem;">
          Track habits, break bad ones, and stay consistent with DailyStride — your simple daily growth companion.
        </p>
      </header>

      <section>
        <p>
          <a href="https://play.google.com/store/apps/details?id=com.molokochris.dailystride" style="display: inline-block; background: #000; color: #fff; padding: 12px 24px; border-radius: 12px; text-decoration: none; margin: 8px;">Get it on Google Play</a>
        </p>
        <p style="font-size: 0.875rem; color: #888; margin-top: 1rem;">
          Now in review on Google Play. App Store release coming soon.
        </p>
      </section>

      <footer style="margin-top: 4rem; font-size: 0.875rem; color: #999;">
        <p>© 2026 DailyStride</p>
        <p>
          <a href="/privacy.html" style="color: #50BF56; text-decoration: none;">Privacy Policy</a>
          &nbsp;|&nbsp;
          <a href="mailto:molokochrisp742@gmail.com" style="color: #50BF56; text-decoration: none;">Contact</a>
        </p>
      </footer>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
